<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">真实语言使用统计</title>
  <desc id="desc">根据 Birditch 本人和所属组织中实际参与的 72 个一方仓库汇总 GitHub Linguist 语言字节。</desc>
  <rect width="960" height="370" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 1H960" stroke="#58a6ff" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="48" y="45" fill="#ffffff" font-size="24" font-weight="800">Actual language usage</text>
    <text x="48" y="71" fill="#8b949e" font-size="13">个人 + 9 个组织 · 仅统计实际参与的一方仓库 · 排除 fork、归档与构建标记语言</text>
    <text x="48" y="106" fill="#8b949e" font-size="11" font-weight="800">REPOSITORIES</text>
    <text x="146" y="106" fill="#f8fafc" font-size="18" font-weight="800">72</text>
    <text x="246" y="106" fill="#8b949e" font-size="11" font-weight="800">PUBLIC / PRIVATE</text>
    <text x="377" y="106" fill="#f8fafc" font-size="18" font-weight="800">8 / 64</text>
    <text x="524" y="106" fill="#8b949e" font-size="11" font-weight="800">SOURCE VOLUME</text>
    <text x="648" y="106" fill="#f8fafc" font-size="18" font-weight="800">155.8 MB</text>
    <rect x="48" y="134" width="305" height="16" fill="#b07219"><title>Java 35.3%</title></rect><rect x="353" y="134" width="242" height="16" fill="#882B0F"><title>ActionScript 28.1%</title></rect><rect x="595" y="134" width="163" height="16" fill="#3178c6"><title>TypeScript 18.9%</title></rect><rect x="758" y="134" width="41" height="16" fill="#00ADD8"><title>Go 4.7%</title></rect><rect x="799" y="134" width="35" height="16" fill="#A97BFF"><title>Kotlin 4.0%</title></rect><rect x="834" y="134" width="30" height="16" fill="#7355dd"><title>C# 3.5%</title></rect><rect x="864" y="134" width="14" height="16" fill="#F05138"><title>Swift 1.6%</title></rect><rect x="878" y="134" width="9" height="16" fill="#f34b7d"><title>C++ 1.1%</title></rect><rect x="887" y="134" width="25" height="16" fill="#6e7681"><title>Other 2.8%</title></rect>
    
